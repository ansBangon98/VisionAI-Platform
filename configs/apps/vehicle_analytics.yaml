application:
  name: Vehicle Analytics
  pipeline: detection
  enabled: false

source:
  name: parking_area

primary_model:
  name: vehicle_detector
  task: detection
  model: models/detection/vehicle/model.onnx
  backend: onnxruntime
  device: auto
  providers: []
  confidence_threshold: 0.4
  nms_iou_threshold: 0.45
  input_size: [640, 640]
  input_shape: [1, 3, 640, 640]

secondary_models: {}

tracker:
  type: bytetrack
  track_thresh: 0.5
  match_thresh: 0.8
  track_buffer: 30
  frame_rate: 30
