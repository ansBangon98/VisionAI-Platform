application:
  name: Detection Demo
  pipeline: detection

source:
  name: video_file_0

primary_model:
  name: demo_object_detector
  task: detection
  model: models/detection/demo_detection/model.xml
  backend: openvino
  # Supported backend values: onnxruntime, openvino, pytorch, tensorrt.
  # TensorRT uses a serialized engine file such as .engine, not the .onnx file.
  device: CPU
  providers: []
  performance_hint: LATENCY
  confidence_threshold: 0.25
  nms_iou_threshold: 0.45
  input_size: [640, 640]
  input_shape: [1, 3, 640, 640]
  detect_class_ids: []
  classes:
    0: Fudgee Barr
    1: Mouse
    2: Remote
    3: Screwdriver
    4: Phone Toy
    5: Guitar
    6: Electric Fan
    7: Toy Car
    8: Cap

tracker:
  type: bytetrack
  track_thresh: 0.5
  match_thresh: 0.8
  track_buffer: 30
  frame_rate: 30

analytics:
  enabled: false

dashboard:
  analytics_summary:
    enabled: true
    metrics:
      # - key: total_detections
      #   label: Total detections
      #   type: progress
      #   max: 500
      #   color: "#6697f5"
      #   format: count
      - key: objects_in_frame
        label: Objects in frame
        type: progress
        max: 20
        color: "#69c29b"
        format: count
      - key: unique_classes
        label: Unique classes
        type: progress
        max: 9
        color: "#edb34e"
        format: count
      - key: top_detected_class
        label: Top detected class
        type: text
    class_distribution:
      enabled: true
      max_items: 9

  event_history:
    enabled: true
    max_items: 10
    events:
      - object_appeared
      - object_disappeared

  detection_results:
    enabled: true
    max_items: 10
    columns:
      - class
      - confidence
      - track_id

  session_stats:
    enabled: true
    metrics:
      - fps
      - inference_ms
      - frames_processed
      - session_duration
      - model
      - backend
      - device
      - input

secondary_models:
  gender:
    enabled: false
    task: classification
    model: models/classification/gender/model.xml
    backend: openvino
    device: CPU
    operate_on_classes: []

  emotion:
    enabled: false
    task: classification
    model: models/classification/emotion/model.xml
    backend: openvino
    device: CPU
    operate_on_classes: []
